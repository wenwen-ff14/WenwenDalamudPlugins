name: Sync plugin repository
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sources.json
      - scripts/**
      - .github/workflows/sync.yml
permissions:
  contents: write
concurrency:
  group: sync-plugin-repository
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/sync.test.mjs
      - run: node scripts/sync.mjs
      - name: Publish changed manifest
        shell: bash
        run: |
          if git diff --quiet -- pluginmaster.json; then
            echo 'No manifest changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pluginmaster.json
          git commit -m 'Sync plugin versions'
          git push
